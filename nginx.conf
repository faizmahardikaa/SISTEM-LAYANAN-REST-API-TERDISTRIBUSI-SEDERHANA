worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 256;
}

http {
    default_type application/json;
    log_format upstream_log '$time_iso8601 "$request" status=$status '
                            'upstream=$upstream_addr upstream_status=$upstream_status';
    access_log logs/access.log upstream_log;
    client_body_temp_path logs/client_body;
    proxy_temp_path logs/proxy_temp;

    upstream backend {
        # Round-robin adalah metode default NGINX.
        server 127.0.0.1:5001 max_fails=1 fail_timeout=30s;
        server 127.0.0.1:5002 max_fails=1 fail_timeout=30s;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        client_max_body_size 16k;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
